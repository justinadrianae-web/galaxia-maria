<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Universo de María ✨</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; font-family: 'Helvetica', sans-serif; }
        /* Fondo un poco más oscuro para contraste TikTok */
        canvas { display: block; cursor: grab; }
        canvas:active { cursor: grabbing; }
        
        /* Textos superiores con colores TikTok (Cian y Magenta) */
        #ui { position: absolute; top: 15px; width: 100%; text-align: center; color: white; pointer-events: none; z-index: 5; }
        #ui h1 { margin: 0; font-size: 2.2em; letter-spacing: 2px; text-shadow: 2px 2px 0px #00f2ea, -2px -2px 0px #ff0050; }
        #ui p { margin: 10px 0 0 0; color: #E0E0E0; font-size: 1.1em; font-weight: bold; }

        /* Ventana emergente (Modal) estilo moderno */
        #modal {
            display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(20, 20, 20, 0.95); /* Fondo casi negro */
            border: 3px solid;
            border-image: linear-gradient(45deg, #00f2ea, #ff0050) 1; /* Borde degradado TikTok */
            padding: 40px; text-align: center; color: white; 
            box-shadow: 0 0 50px rgba(0, 242, 234, 0.3), 0 0 50px rgba(255, 0, 80, 0.3);
            width: 85%; max-width: 550px; z-index: 100; backdrop-filter: blur(10px);
            border-radius: 20px; /* Redondeado manual si border-image falla */
        }
        #modal h2 { margin: 0 0 20px 0; font-size: 2.5em; color: #ffffff; text-shadow: 2px 2px 0px #ff0050; font-weight: bold; text-transform: uppercase;}
        #modal p { font-size: 1.6em; line-height: 1.5; font-weight: 500; color: #F0F0F0; }
        
        #close-btn {
            background: linear-gradient(45deg, #ff0050, #00f2ea); border: none; color: white; padding: 15px 40px; 
            font-size: 1.3em; border-radius: 50px; cursor: pointer; margin-top: 30px; font-weight: bold;
            box-shadow: 0 5px 25px rgba(0, 242, 234, 0.5); transition: 0.3s; text-transform: uppercase;
        }
        #close-btn:hover { transform: scale(1.05); box-shadow: 0 5px 35px rgba(255, 0, 80, 0.8); }
    </style>
</head>
<body>

    <div id="ui">
        <h1>✨ El Universo de María ✨</h1>
        <p>Toca la pantalla para activar la fiesta 🎵<br>Busca las estrellas de tus locuras 👆</p>
    </div>

    <audio id="bg-music" loop hidden>
        <source src="musica_maria.mp3" type="audio/mpeg">
    </audio>

    <div id="modal">
        <h2 id="modal-title">Título</h2>
        <p id="modal-text">Mensaje</p>
        <button id="close-btn" onclick="document.getElementById('modal').style.display='none'">Cerrar</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <script>
        // --- ACTIVAR MÚSICA ---
        window.addEventListener('click', function() {
            const audio = document.getElementById('bg-music');
            if (audio.paused) {
                audio.volume = 0.6; // Un poco más alto para que sea divertido
                audio.play().catch(e => console.log("Esperando interacción..."));
            }
        }, { once: true });

        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050505, 0.002); // Niebla oscura

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.z = 160;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.5; // Gira un poco más rápido, más energía

        // 1. Galaxia TikTok (Cian y Magenta)
        const particlesGeometry = new THREE.BufferGeometry();
        const particlesCount = 13000;
        const posArray = new Float32Array(particlesCount * 3);
        const colorsArray = new Float32Array(particlesCount * 3);

        for(let i = 0; i < particlesCount * 3; i+=3) {
            const r = 300 * Math.cbrt(Math.random());
            const theta = Math.random() * 2 * Math.PI;
            const phi = Math.acos(2 * Math.random() - 1);
            
            posArray[i] = r * Math.sin(phi) * Math.cos(theta);
            posArray[i+1] = r * Math.sin(phi) * Math.sin(theta);
            posArray[i+2] = r * Math.cos(phi) * 0.7; 

            // Alternar colores estilo TikTok
            if (i % 6 === 0) { // Cian
                colorsArray[i] = 0.0; colorsArray[i+1] = 0.95; colorsArray[i+2] = 0.92;
            } else if (i % 6 === 3) { // Magenta
                colorsArray[i] = 1.0; colorsArray[i+1] = 0.0; colorsArray[i+2] = 0.31;
            } else { // Blanco/Azulado para relleno
                 colorsArray[i] = 0.8; colorsArray[i+1] = 0.8; colorsArray[i+2] = 1.0;
            }
        }
        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        particlesGeometry.setAttribute('color', new THREE.BufferAttribute(colorsArray, 3));

        // Partículas más nítidas y brillantes
        const particlesMaterial = new THREE.PointsMaterial({ size: 1.5, vertexColors: true, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending });
        const particleMesh = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particleMesh);

        // 2. Estrellas Principales (Personalizadas para María)
        const clickableObjects = [];
        const starGeometry = new THREE.SphereGeometry(3, 16, 16);
        const starMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff }); // Estrellas blancas brillantes
        // Halo Cian/Magenta
        const haloGeom = new THREE.SphereGeometry(6, 16, 16);
        const haloMatCian = new THREE.MeshBasicMaterial({ color: 0x00f2ea, transparent: true, opacity: 0.5, blending: THREE.AdditiveBlending });
        const haloMatMagenta = new THREE.MeshBasicMaterial({ color: 0xff0050, transparent: true, opacity: 0.5, blending: THREE.AdditiveBlending });

        const mainMemories = [
            { title: "👑 Reina del TikTok", text: "Sigue brillando, grabando y haciéndonos reír. ¡Naciste para ser viral, nena! 🤳✨" },
            { title: "🐱 Michi-Lover Suprema", text: "Este rincón del universo está dedicado a los dueños de internet (los gatos, obvio) y a su Karen favorita. 🐾🖤" },
            { title: "🖤 Tinta & Arte", text: "Cada tatuaje es una historia en tu piel. Eres un lienzo de arte en movimiento y te ves increíble. 💉🔥" },
            { title: "✨ Esa Chispa Única", text: "Morenita, chiquita pero picosa. Tu energía divertida ilumina todo. ¡Nunca cambies esa locura hermosa! 🤪⚡" },
            { title: "🔒 Lealtad Real", text: "En un mundo de trends pasajeros, tu amistad es lo más real y fiel que existe. Eso vale oro. 💯💖" }
        ];

        mainMemories.forEach((mem, index) => {
            const star = new THREE.Mesh(starGeometry, starMaterial);
            const spread = 140;
            star.position.set((Math.random() - 0.5) * spread, (Math.random() - 0.5) * spread, (Math.random() - 0.5) * spread);
            star.userData = { title: mem.title, text: mem.text };
            scene.add(star);
            clickableObjects.push(star);
            
            // Alternar halos cian y magenta
            const halo = new THREE.Mesh(haloGeom, index % 2 === 0 ? haloMatCian : haloMatMagenta);
            halo.scale.set(1.3, 1.3, 1.3);
            star.add(halo);
        });

        // 3. Estrellas de Relleno Divertidas
        const fillerTexts = ["🤳 Grabando...", "😹 LOL", "🐾 Miau", "✨ Viral", "🖤 Tinta fresca", "🔥 Dale like", "🤪 Mood"];
        for(let i = 0; i < 250; i++) {
            const randomText = fillerTexts[Math.floor(Math.random() * fillerTexts.length)];
            const star = new THREE.Mesh(starGeometry, starMaterial); star.scale.set(0.5,0.5,0.5);
            star.position.set((Math.random() - 0.5) * 350, (Math.random() - 0.5) * 350, (Math.random() - 0.5) * 350);
            star.userData = { title: "✨", text: randomText };
            scene.add(star);
            clickableObjects.push(star);
             const haloSmall = new THREE.Mesh(haloGeom, i % 2 === 0 ? haloMatCian : haloMatMagenta); haloSmall.scale.set(0.8,0.8,0.8);
             star.add(haloSmall);
        }

        // Sistema de Clicks
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function openModal(data) {
            controls.autoRotate = false; 
            document.getElementById('modal-title').innerHTML = data.title;
            document.getElementById('modal-text').innerHTML = data.text;
            document.getElementById('modal').style.display = 'block';
        }

        function checkIntersection(clientX, clientY) {
            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(clickableObjects);
            if (intersects.length > 0) openModal(intersects[0].object.userData);
        }

        window.addEventListener('click', (e) => { if(e.target.id !== 'close-btn') checkIntersection(e.clientX, e.clientY); });
        window.addEventListener('touchstart', (e) => { if(e.target.id !== 'close-btn' && e.touches.length > 0) checkIntersection(e.touches[0].clientX, e.touches[0].clientY); });

        function animate() {
            requestAnimationFrame(animate);
            particleMesh.rotation.y -= 0.001; // Gira al otro lado para variar
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
