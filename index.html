<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para mi Niña Hermosa 💖</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #0a0005; font-family: 'Helvetica', sans-serif; }
        canvas { display: block; cursor: grab; }
        canvas:active { cursor: grabbing; }
        
        #ui { position: absolute; top: 15px; width: 100%; text-align: center; color: white; pointer-events: none; z-index: 5; }
        #ui h1 { margin: 0; font-size: 2.5em; letter-spacing: 2px; text-shadow: 0px 0px 15px #ff0050; }
        #ui p { margin: 10px 0 0 0; color: #ffb3c6; font-size: 1.2em; font-weight: bold; }

        #modal {
            display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(20, 0, 10, 0.95); 
            border: 3px solid #ff0050;
            padding: 40px; text-align: center; color: white; 
            box-shadow: 0 0 40px rgba(255, 0, 80, 0.5);
            width: 85%; max-width: 550px; z-index: 100; backdrop-filter: blur(10px);
            border-radius: 25px;
        }
        #modal h2 { margin: 0 0 20px 0; font-size: 2.2em; color: #ff4d6d; text-shadow: 2px 2px 5px #000; font-weight: bold;}
        #modal p { font-size: 1.6em; line-height: 1.5; font-weight: 500; color: #fff0f3; font-style: italic; }
        
        #close-btn {
            background: linear-gradient(45deg, #ff0050, #c9184a); border: none; color: white; padding: 15px 40px; 
            font-size: 1.2em; border-radius: 50px; cursor: pointer; margin-top: 30px; font-weight: bold;
            box-shadow: 0 5px 20px rgba(255, 0, 80, 0.4); transition: 0.3s;
        }
        #close-btn:hover { transform: scale(1.05); box-shadow: 0 5px 30px rgba(255, 0, 80, 0.7); }
    </style>
</head>
<body>

    <div id="ui">
        <h1>✨ Mi Universo Eres Tú ✨</h1>
        <p>Toca la pantalla para la música 🎵<br>Tienes 100 estrellas por descubrir, mi amor 👇</p>
    </div>

    <audio id="bg-music" loop hidden>
        <source src="musica_maria.mp3" type="audio/mpeg">
    </audio>

    <div id="modal">
        <h2 id="modal-title">Título</h2>
        <p id="modal-text">Mensaje</p>
        <button id="close-btn" onclick="document.getElementById('modal').style.display='none'">Te amo ❤️</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <script>
        // Activar música
        window.addEventListener('click', function() {
            const audio = document.getElementById('bg-music');
            if (audio.paused) {
                audio.volume = 0.6; 
                audio.play().catch(e => console.log("Esperando interacción..."));
            }
        }, { once: true });

        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x0a0005, 0.002); 

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.z = 140;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.3;

        // Fondo de Polvo Estelar (Para que no se vea vacío)
        const particlesGeometry = new THREE.BufferGeometry();
        const particlesCount = 8000;
        const posArray = new Float32Array(particlesCount * 3);
        const colorsArray = new Float32Array(particlesCount * 3);

        for(let i = 0; i < particlesCount * 3; i+=3) {
            const r = 250 * Math.cbrt(Math.random());
            const theta = Math.random() * 2 * Math.PI;
            const phi = Math.acos(2 * Math.random() - 1);
            posArray[i] = r * Math.sin(phi) * Math.cos(theta);
            posArray[i+1] = r * Math.sin(phi) * Math.sin(theta);
            posArray[i+2] = r * Math.cos(phi) * 0.7; 

            // Colores románticos: Rojos, rosas y toques de cian
            colorsArray[i] = 0.8 + Math.random() * 0.2; // R
            colorsArray[i+1] = Math.random() * 0.3; // G
            colorsArray[i+2] = 0.4 + Math.random() * 0.4; // B
        }
        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        particlesGeometry.setAttribute('color', new THREE.BufferAttribute(colorsArray, 3));
        const particlesMaterial = new THREE.PointsMaterial({ size: 1.2, vertexColors: true, transparent: true, opacity: 0.6, blending: THREE.AdditiveBlending });
        scene.add(new THREE.Points(particlesGeometry, particlesMaterial));

        // LAS 100 ESTRELLAS FUNCIONALES
        const clickableObjects = [];
        const starGeometry = new THREE.SphereGeometry(3.5, 16, 16);
        const starMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const haloGeom = new THREE.SphereGeometry(7, 16, 16);
        const haloMat = new THREE.MeshBasicMaterial({ color: 0xff0050, transparent: true, opacity: 0.4, blending: THREE.AdditiveBlending });

        // Lista de frases románticas y personalizadas
        const mensajesAmor = [
            { t: "❤️ TE AMO ❤️", m: "Eres el amor de mi vida. Gracias por existir y por ser mi novia." },
            { t: "✨ Mi Morenita", m: "Me encanta todo de ti. Eres la mujer más hermosa de este universo y de todos los demás." },
            { t: "👑 Reina de mi Corazón", m: "Chiquita, gordita y absolutamente perfecta para mí. Te amo tal y como eres." },
            { t: "🐱 Karen Favorita", m: "Te amo incluso más de lo que tus michis aman dormir (y eso ya es muchísimo decir)." },
            { t: "🖤 Arte en tu Piel", m: "Cada tatuaje tuyo cuenta una historia, pero mi historia favorita es la que estamos escribiendo juntos." },
            { t: "📱 Mi Trend Favorito", m: "Podría verte hacer TikToks todo el día. Tu personalidad divertida es mi batería." },
            { t: "🔒 Lealtad Pura", m: "En un mundo tan loco, tu lealtad y tu amor son mi mayor refugio. Gracias por ser tan fiel." },
            { t: "💖 Poema para ti", m: "Tardé un minuto en conocerte, pero me tomaría toda la eternidad olvidarte. Te amo." },
            { t: "😍 Locura Hermosa", m: "Amo tu energía, amo cómo me haces reír, amo que seas tú." },
            { t: "💫 Casualidad", m: "De todos los lugares y tiempos posibles, qué suerte tuve de coincidir contigo." },
            { t: "🥰 Mi Lugar Seguro", m: "No importa qué pase allá afuera, mis brazos siempre serán tu hogar." },
            { t: "💘 Te Amo", m: "Solo quería recordarte que te amo. Hoy, mañana y siempre." }
        ];

        // Crear exactamente 100 estrellas
        for(let i = 0; i < 100; i++) {
            const star = new THREE.Mesh(starGeometry, starMaterial);
            // Distribuirlas para que sean fáciles de encontrar
            const spread = 180;
            star.position.set((Math.random() - 0.5) * spread, (Math.random() - 0.5) * spread, (Math.random() - 0.5) * spread);
            
            // Asignar un mensaje de la lista (se repiten circularmente para llenar las 100)
            const mensaje = mensajesAmor[i % mensajesAmor.length];
            
            // La primera estrella siempre será el "Te amo" principal
            if(i === 0) {
                star.userData = { title: "🎁 PARA MI NOVIA", text: "Hice este pedacito de universo solo para ti, porque tú eres el mío. ¡Feliz día mi amor!" };
                star.scale.set(1.5, 1.5, 1.5); // Hacerla un poquito más grande
            } else {
                star.userData = { title: mensaje.t, text: mensaje.m };
            }

            scene.add(star);
            clickableObjects.push(star);
            
            const halo = new THREE.Mesh(haloGeom, haloMat);
            star.add(halo);
        }

        // Sistema de Clicks
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function checkIntersection(clientX, clientY) {
            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            
            const intersects = raycaster.intersectObjects(clickableObjects);
            if (intersects.length > 0) {
                controls.autoRotate = false; 
                document.getElementById('modal-title').innerHTML = intersects[0].object.userData.title;
                document.getElementById('modal-text').innerHTML = intersects[0].object.userData.text;
                document.getElementById('modal').style.display = 'block';
            }
        }

        window.addEventListener('click', (e) => { if(e.target.id !== 'close-btn') checkIntersection(e.clientX, e.clientY); });
        window.addEventListener('touchstart', (e) => { if(e.target.id !== 'close-btn' && e.touches.length > 0) checkIntersection(e.touches[0].clientX, e.touches[0].clientY); });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
