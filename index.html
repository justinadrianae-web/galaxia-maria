<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para mi Niña Hermosa 💖</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #0a0005; font-family: 'Helvetica', sans-serif; }
        canvas { display: block; cursor: grab; }
        canvas:active { cursor: grabbing; }
        
        #ui { position: absolute; top: 15px; width: 100%; text-align: center; color: white; pointer-events: none; z-index: 5; }
        #ui h1 { margin: 0; font-size: 2.5em; letter-spacing: 2px; text-shadow: 0px 0px 15px #ff0050; }
        #ui p { margin: 10px 0 0 0; color: #ffb3c6; font-size: 1.2em; font-weight: bold; }

        /* Buscador de Coordenadas */
        #search-container {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: rgba(20, 0, 10, 0.8); border: 2px solid #ff0050; border-radius: 30px;
            padding: 10px 20px; display: flex; gap: 10px; z-index: 10; backdrop-filter: blur(5px);
            box-shadow: 0 0 20px rgba(255, 0, 80, 0.4);
        }
        #coord-input {
            background: transparent; border: none; color: white; font-size: 1em; outline: none;
            text-align: center; width: 180px; font-family: monospace;
        }
        #coord-input::placeholder { color: #ffb3c6; opacity: 0.7; }
        #search-btn {
            background: linear-gradient(45deg, #ff0050, #c9184a); border: none; color: white; padding: 8px 20px;
            border-radius: 20px; cursor: pointer; font-weight: bold; transition: 0.3s;
        }
        #search-btn:hover { transform: scale(1.05); box-shadow: 0 0 10px #ff0050; }

        /* Ventana Emergente */
        #modal {
            display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(20, 0, 10, 0.95); border: 3px solid #ff0050;
            padding: 40px; text-align: center; color: white; 
            box-shadow: 0 0 40px rgba(255, 0, 80, 0.5);
            width: 85%; max-width: 550px; z-index: 100; backdrop-filter: blur(10px); border-radius: 25px;
        }
        #modal h2 { margin: 0 0 20px 0; font-size: 2.2em; color: #ff4d6d; text-shadow: 2px 2px 5px #000; font-weight: bold;}
        #modal p { font-size: 1.6em; line-height: 1.5; font-weight: 500; color: #fff0f3; font-style: italic; }
        #modal-coord { display: block; margin-top: 20px; font-size: 1em; color: #ffb3c6; font-family: monospace; }
        
        #close-btn {
            background: linear-gradient(45deg, #ff0050, #c9184a); border: none; color: white; padding: 15px 40px; 
            font-size: 1.2em; border-radius: 50px; cursor: pointer; margin-top: 20px; font-weight: bold;
            box-shadow: 0 5px 20px rgba(255, 0, 80, 0.4); transition: 0.3s;
        }
        #close-btn:hover { transform: scale(1.05); box-shadow: 0 5px 30px rgba(255, 0, 80, 0.7); }
    </style>
</head>
<body>

    <div id="ui">
        <h1>✨ Mi Universo Eres Tú ✨</h1>
        <p>Toca la pantalla para la música 🎵<br>Tienes 100 estrellas por descubrir 👇</p>
    </div>

    <div id="search-container">
        <input type="text" id="coord-input" placeholder="Ej: 14.02.26">
        <button id="search-btn" onclick="searchCoordinate()">Buscar</button>
    </div>

    <audio id="bg-music" loop hidden>
        <source src="Manuel%20Medrano%20-%20Donde%20Nadie%20Pueda%20Ir.mp3" type="audio/mpeg">
    </audio>

    <div id="modal">
        <h2 id="modal-title">Título</h2>
        <p id="modal-text">Mensaje</p>
        <span id="modal-coord"></span><br>
        <button id="close-btn" onclick="document.getElementById('modal').style.display='none'">Te amo ❤️</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <script>
        // Activar música
        window.addEventListener('click', function() {
            const audio = document.getElementById('bg-music');
            if (audio.paused) {
                audio.volume = 0.5; 
                audio.play().catch(e => console.log("Esperando interacción..."));
            }
        }, { once: true });

        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x0a0005, 0.002); 

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.z = 140;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.3;

        // Fondo de Polvo Estelar
        const particlesGeometry = new THREE.BufferGeometry();
        const particlesCount = 8000;
        const posArray = new Float32Array(particlesCount * 3);
        const colorsArray = new Float32Array(particlesCount * 3);

        for(let i = 0; i < particlesCount * 3; i+=3) {
            const r = 250 * Math.cbrt(Math.random());
            const theta = Math.random() * 2 * Math.PI;
            const phi = Math.acos(2 * Math.random() - 1);
            posArray[i] = r * Math.sin(phi) * Math.cos(theta);
            posArray[i+1] = r * Math.sin(phi) * Math.sin(theta);
            posArray[i+2] = r * Math.cos(phi) * 0.7; 

            colorsArray[i] = 0.8 + Math.random() * 0.2; 
            colorsArray[i+1] = Math.random() * 0.3; 
            colorsArray[i+2] = 0.4 + Math.random() * 0.4; 
        }
        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        particlesGeometry.setAttribute('color', new THREE.BufferAttribute(colorsArray, 3));
        const particlesMaterial = new THREE.PointsMaterial({ size: 1.2, vertexColors: true, transparent: true, opacity: 0.6, blending: THREE.AdditiveBlending });
        scene.add(new THREE.Points(particlesGeometry, particlesMaterial));

        // LAS 100 ESTRELLAS FUNCIONALES
        const clickableObjects = [];
        const starGeometry = new THREE.SphereGeometry(3.5, 16, 16);
        const starMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const haloGeom = new THREE.SphereGeometry(7, 16, 16);
        const haloMat = new THREE.MeshBasicMaterial({ color: 0xff0050, transparent: true, opacity: 0.4, blending: THREE.AdditiveBlending });

        // Lista de frases con sus COORDENADAS EXACTAS
        const mensajesAmor = [
            { t: "🎁 PARA MI NOVIA", m: "Hice este pedacito de universo solo para ti. ¡Feliz San Valentín, mi amor!", c: "14.02.26" },
            { t: "❤️ TE AMO ❤️", m: "Eres el amor de mi vida. Gracias por existir y por ser mi novia.", c: "01.00.00" },
            { t: "✨ Mi Morenita", m: "Me encanta todo de ti. Eres la mujer más hermosa de este universo.", c: "02.00.00" },
            { t: "👑 Reina de mi Corazón", m: "Chiquita, gordita y absolutamente perfecta para mí. Te amo tal y como eres.", c: "03.00.00" },
            { t: "🐱 Karen Favorita", m: "Te amo incluso más de lo que tus michis aman dormir (y eso ya es mucho).", c: "04.00.00" },
            { t: "🖤 Arte en tu Piel", m: "Cada tatuaje tuyo cuenta una historia, pero mi favorita es la nuestra.", c: "05.00.00" },
            { t: "📱 Mi Trend Favorito", m: "Podría verte hacer TikToks todo el día. Tu energía es mi batería.", c: "06.00.00" },
            { t: "🔒 Lealtad Pura", m: "En un mundo tan loco, tu lealtad y tu amor son mi mayor refugio.", c: "07.00.00" },
            { t: "💖 Poema para ti", m: "Tardé un minuto en conocerte, pero me tomaría toda la eternidad olvidarte.", c: "08.00.00" },
            { t: "😍 Locura Hermosa", m: "Amo tu energía, amo cómo me haces reír, amo que seas tú.", c: "09.00.00" },
            { t: "💫 Casualidad", m: "De todos los lugares y tiempos posibles, qué suerte tuve de coincidir contigo.", c: "10.00.00" },
            { t: "🥰 Mi Lugar Seguro", m: "No importa qué pase allá afuera, mis brazos siempre serán tu hogar.", c: "11.00.00" }
        ];

        // Generar 100 estrellas
        for(let i = 0; i < 100; i++) {
            const star = new THREE.Mesh(starGeometry, starMaterial);
            const spread = 180;
            star.position.set((Math.random() - 0.5) * spread, (Math.random() - 0.5) * spread, (Math.random() - 0.5) * spread);
            
            let data;
            if(i < mensajesAmor.length) {
                // Las estrellas principales
                data = { title: mensajesAmor[i].t, text: mensajesAmor[i].m, coord: mensajesAmor[i].c };
                if(i === 0) star.scale.set(1.5, 1.5, 1.5);
            } else {
                // El resto de las 100 estrellas repiten los mensajes pero tienen coordenadas secretas
                let msgAleatorio = mensajesAmor[Math.floor(Math.random() * mensajesAmor.length)];
                let coordSecreta = "99." + Math.floor(Math.random() * 90 + 10) + "." + i;
                data = { title: msgAleatorio.t, text: msgAleatorio.m, coord: coordSecreta };
            }

            star.userData = data;
            scene.add(star);
            clickableObjects.push(star);
            
            const halo = new THREE.Mesh(haloGeom, haloMat);
            star.add(halo);
        }

        // Sistema de Clicks
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function openModal(data) {
            controls.autoRotate = false; 
            document.getElementById('modal-title').innerHTML = data.title;
            document.getElementById('modal-text').innerHTML = data.text;
            document.getElementById('modal-coord').innerHTML = "Coordenada: " + data.coord;
            document.getElementById('modal').style.display = 'block';
        }

        function checkIntersection(clientX, clientY) {
            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            
            const intersects = raycaster.intersectObjects(clickableObjects);
            if (intersects.length > 0) openModal(intersects[0].object.userData);
        }

        window.addEventListener('click', (e) => { 
            if(e.target.id !== 'close-btn' && e.target.id !== 'coord-input' && e.target.id !== 'search-btn') checkIntersection(e.clientX, e.clientY); 
        });
        window.addEventListener('touchstart', (e) => { 
            if(e.target.id !== 'close-btn' && e.target.id !== 'coord-input' && e.target.id !== 'search-btn') {
                if(e.touches.length > 0) checkIntersection(e.touches[0].clientX, e.touches[0].clientY);
            }
        });

        // Búsqueda por coordenadas
        window.searchCoordinate = function() {
            const inputVal = document.getElementById('coord-input').value.trim();
            if(!inputVal) return;
            const starFound = clickableObjects.find(star => star.userData.coord === inputVal);
            if(starFound) {
                openModal(starFound.userData);
                document.getElementById('coord-input').value = ""; 
            } else {
                alert("La coordenada '" + inputVal + "' no se encuentra. Revisa tu mapa estelar.");
            }
        };

        document.getElementById('coord-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') searchCoordinate();
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
